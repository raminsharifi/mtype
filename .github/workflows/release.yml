name: release

# Builds binaries for macOS (Apple Silicon and Intel) and Linux when a release
# is published, and attaches them to that release so people can download mtype
# without installing Rust.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload binaries to
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: mtype-linux-x86_64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: mtype-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: mtype-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage binary
        run: cp target/${{ matrix.target }}/release/mtype ${{ matrix.asset }}
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" "${{ matrix.asset }}" --clobber
